<text x="48" y="52" fill="#0f172a" font-size="26" font-weight="800">System architecture</text><text x="48" y="78" fill="#64748b" font-size="14">Personal form values stay inside the browser boundary.</text>
<rect x="42" y="108" width="480" height="338" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="7 6"/><text x="62" y="138" fill="#1d4ed8" font-size="13" font-weight="800">USER'S BROWSER</text>
