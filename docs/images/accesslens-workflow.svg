<title id="t">AccessLens template lifecycle</title><desc id="d">Six stages from form detection to user-controlled submission.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="360" rx="24" fill="#0f172a"/><g font-family="Inter,Segoe UI,sans-serif"><text x="48" y="52" fill="white" font-size="26" font-weight="800">Template lifecycle</text><text x="48" y="78" fill="#94a3b8" font-size="14">AI can propose a mapping; a developer decides whether it becomes trusted support.</text>
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M216 191h30"/><path d="M410 191h30"/><path d="M604 191h30"/><path d="M798 191h30"/><path d="M992 191h30"/></g>
<g fill="white"><rect x="52" y="116" width="164" height="150" rx="15"/><rect x="246" y="116" width="164" height="150" rx="15"/><rect x="440" y="116" width="164" height="150" rx="15"/><rect x="634" y="116" width="164" height="150" rx="15"/><rect x="828" y="116" width="164" height="150" rx="15"/><rect x="1022" y="116" width="126" height="150" rx="15"/></g>
<g font-size="16" font-weight="800"><circle cx="82" cy="148" r="17" fill="#dbeafe"/><text x="77" y="154" fill="#1d4ed8">1</text><circle cx="276" cy="148" r="17" fill="#dbeafe"/><text x="271" y="154" fill="#1d4ed8">2</text><circle cx="470" cy="148" r="17" fill="#fef3c7"/><text x="465" y="154" fill="#b45309">3</text><circle cx="664" cy="148" r="17" fill="#ede9fe"/><text x="659" y="154" fill="#6d28d9">4</text><circle cx="858" cy="148" r="17" fill="#dcfce7"/><text x="853" y="154" fill="#15803d">5</text><circle cx="1052" cy="148" r="17" fill="#dcfce7"/><text x="1047" y="154" fill="#15803d">6</text></g>
<g fill="#0f172a" font-size="15" font-weight="800"><text x="70" y="188">Detect form</text><text x="264" y="188">Find template</text><text x="458" y="188">Generate draft</text><text x="652" y="188">Human review</text><text x="846" y="188">Review &amp; fill</text><text x="1040" y="188">Submit</text></g>
<g fill="#64748b" font-size="11"><text x="70" y="214">Read the page URL</text><text x="70" y="232">and form structure</text><text x="264" y="214">Use an approved</text><text x="264" y="232">database mapping first</text><text x="458" y="214">Send only filtered</text><text x="458" y="232">structural metadata</text><text x="652" y="214">Validate selectors,</text><text x="652" y="232">then approve or reject</text><text x="846" y="214">User confirms values</text><text x="846" y="232">before native filling</text><text x="1040" y="214">Always left</text><text x="1040" y="232">to the user</text></g>
